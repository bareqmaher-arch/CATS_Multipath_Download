worker_processes 2;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;
events { worker_connections 4096; }

http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 300s;
  keepalive_requests 1000000;
  client_body_temp_path /tmp/nginx-body;

  server {
    # 8080: HTTP/1.1, one request per block (Plexo). 8081: HTTP/2 without TLS, by prior
    # knowledge, for sub-ranges as streams on one connection (cats5, plexo-mux3).
    listen 8080;
    listen 8081 http2;
    root /srv/files;
    location / {}
  }
}
